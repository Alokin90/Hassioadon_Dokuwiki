name: "DokuWiki (Ingress)"
description: "A fast and light wiki for your Home Assistant documentation, with native Ingress support"
version: "1.1.0"
stage: experimental
slug: "dokuwiki"
url: "https://github.com/Alokin90/Hassioadon_Dokuwiki"
init: false
boot: auto
startup: application
arch:
